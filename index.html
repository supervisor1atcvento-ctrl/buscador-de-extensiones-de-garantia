<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BD Extensión de garantías — Panel</title>
<style>
:root{
  --brand-white:#FFFFFF;--brand-black:#231F20;--brand-gray:#616160;--brand-accent:#F28F17;
  --bg-soft:linear-gradient(180deg,#fbfdff,#f7f9fb);--card-bg:#FFFFFF;--radius:12px;
  --shadow-soft:0 10px 30px rgba(35,31,32,0.06);--glass:rgba(255,255,255,0.6);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg-soft);color:var(--brand-black);-webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;padding:24px}
.wrap{width:100%;max-width:1200px;padding:8px}
header.appbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg, rgba(242,143,23,0.95), rgba(35,31,32,0.08));display:flex;align-items:center;justify-content:center;color:var(--brand-white);font-weight:800;font-size:22px;box-shadow:var(--shadow-soft);border:2px solid rgba(35,31,32,0.04)}
h1{margin:0;font-size:22px;font-weight:800}
.subtitle{margin:0;color:var(--brand-gray);font-size:13px;font-weight:600}
.card{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-soft);border:1px solid rgba(35,31,32,0.04)}
.controls{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap}
.input{flex:1;min-width:220px;display:flex;gap:8px;align-items:center}
input[type="text"],input[type="password"],select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(35,31,32,0.06);font-size:15px;background:linear-gradient(180deg,#fff,#fbfbfb);color:var(--brand-black);outline:none}
input:focus{box-shadow:0 8px 24px rgba(242,143,23,0.08);border-color:var(--brand-accent)}
.btn{background:var(--brand-accent);color:var(--brand-white);border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(242,143,23,0.12)}
.btn.ghost{background:transparent;color:var(--brand-black);border:1px solid rgba(35,31,32,0.08);box-shadow:none;font-weight:600}
.copy-btn{background:transparent;border:1px dashed rgba(35,31,32,0.06);padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--brand-black)}
.meta{margin-top:10px;color:var(--brand-gray);font-size:13px}
.result-area{margin-top:14px;overflow:auto}
table.results{width:100%;border-collapse:collapse;margin-top:8px;background:var(--card-bg);box-shadow:0 8px 24px rgba(35,31,32,0.04);border-radius:10px;overflow:hidden;min-width:900px}
table.results thead th{padding:12px 14px;text-align:left;font-size:13px;color:var(--brand-black);background:linear-gradient(180deg, rgba(242,143,23,0.04), transparent);border-bottom:1px solid rgba(35,31,32,0.04)}
table.results tbody td{padding:10px 12px;border-bottom:1px solid rgba(35,31,32,0.03);vertical-align:middle;font-size:13px}
.serial{font-weight:800;color:var(--brand-accent)}
.cliente{color:var(--brand-black);font-weight:700}
.fecha{color:var(--brand-gray);font-size:13px}
.estatus{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;color:var(--brand-white)}
.estatus.autorizado{background:linear-gradient(90deg,#16a34a,#059669)}
.estatus.rechazado{background:#ef4444}
.estatus.pendiente{background:linear-gradient(90deg,#f59e0b,#f28f17)}
.pdf-cell{width:160px;text-align:center}
.pdf-preview{width:120px;height:140px;border-radius:10px;overflow:hidden;border:1px solid rgba(35,31,32,0.06);display:flex;align-items:center;justify-content:center;background:var(--glass)}
.pdf-preview iframe{width:100%;height:100%;border:0}
.empty{padding:22px;text-align:center;color:var(--brand-gray);border-radius:10px;background:linear-gradient(180deg,rgba(242,143,23,0.03),transparent)}
.pending-section{margin-top:18px}
.pending-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.pending-table{width:100%;border-collapse:collapse}
.pending-table thead th{padding:10px;font-size:13px;text-align:left;color:var(--brand-gray);border-bottom:1px solid rgba(35,31,32,0.04)}
.pending-table td{padding:8px;border-bottom:1px solid rgba(35,31,32,0.03);font-size:13px}
.split-modal{display:flex;gap:12px;height:80vh}
.split-left{width:40%;overflow:auto;border-radius:8px;padding:10px;border:1px solid rgba(35,31,32,0.04);background:linear-gradient(180deg,#fff,#fbfbff)}
.split-right{flex:1;border-radius:8px;padding:10px;border:1px solid rgba(35,31,32,0.04);display:flex;flex-direction:column}
.field{padding:8px;border-bottom:1px solid rgba(35,31,32,0.03)}
.field strong{display:block;color:var(--brand-gray);font-size:12px;margin-bottom:6px}
.field span{color:var(--brand-black);font-weight:700;word-break:break-word}
.preview-tabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.preview-tab{padding:8px 10px;border-radius:8px;background:rgba(0,0,0,0.03);cursor:pointer;font-weight:700;color:var(--brand-black);border:1px solid rgba(35,31,32,0.04)}
.preview-tab.active{background:linear-gradient(90deg, rgba(242,143,23,0.12), rgba(242,143,23,0.06));border-color:rgba(242,143,23,0.12)}
.detail-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px;border-top:1px solid rgba(35,31,32,0.04);background:linear-gradient(180deg,rgba(255,255,255,0.95),rgba(255,255,255,0.98))}
.small{font-size:13px;color:var(--brand-gray)}
.duplicate-row{background:linear-gradient(90deg, rgba(255,200,200,0.25), rgba(255,240,240,0.25))}
.disabled-hint{color:var(--brand-gray);font-size:13px;margin-right:auto}
.preview-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.preview-controls label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--brand-black)}
@media (max-width:1000px){table.results{min-width:800px}}
@media (max-width:760px){body{padding:12px}.logo{width:48px;height:48px}.wrap{padding:6px}table.results{min-width:700px}.split-modal{flex-direction:column;height:70vh}.split-left{width:100%}.split-right{width:100%}}
/* Supervisor modal styles */
.supervisor-btn{margin-left:8px;background:#0b5fff}
.supervisor-modal{display:none;position:fixed;inset:0;z-index:3000;align-items:center;justify-content:center;padding:20px}
.supervisor-panel{width:100%;max-width:1100px;background:var(--card-bg);border-radius:12px;box-shadow:0 20px 60px rgba(35,31,32,0.25);overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.supervisor-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(35,31,32,0.04);background:linear-gradient(180deg,#fff,#fbfbff)}
.supervisor-body{padding:12px;overflow:auto;flex:1}
.supervisor-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <div class="logo" aria-hidden>V</div>
    <div>
      <h1>BD Extensión de garantías</h1>
      <p class="subtitle">Búsqueda por número de serie • Validación</p>
    </div>
    <div style="margin-left:auto" class="meta">Interfaz Vento</div>
  </header>

  <div class="card" role="main" aria-live="polite">
    <div>
      <strong>Búsqueda por número de serie</strong>
      <div class="controls" style="margin-top:10px">
        <div class="input">
          <input id="serial" type="text" placeholder="Ejemplo: 12345-ABC" aria-label="Número de serie" />
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button id="btnSearch" class="btn">Buscar</button>
          <button id="btnClear" class="btn ghost">Limpiar</button>
          <button id="copyRow" class="copy-btn">Copiar</button>
          <button id="openSupervisor" class="btn supervisor-btn">Abrir panel supervisor</button>
        </div>
      </div>
      <p id="status" class="meta" aria-live="polite"></p>
      <div id="resultArea" class="result-area" role="region" aria-label="Resultados de búsqueda"></div>
    </div>

    <div class="pending-section" id="pendingSection">
      <div class="pending-header">
        <div>
          <strong>Pendientes</strong>
          <div class="small" id="pendingMeta">Cargando pendientes...</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="superPassInline" type="password" placeholder="Contraseña (solo para aprobar/rechazar)" style="padding:8px;border-radius:8px;border:1px solid rgba(35,31,32,0.06)" />
          <button id="btnRefresh" class="btn ghost">Refrescar</button>
          <button id="btnCheckDuplicates" class="btn">Verificar duplicados</button>
          <button id="btnBatchActions" class="btn ghost">Acciones en lote</button>
        </div>
      </div>
      <div id="pendingContainer"></div>
    </div>
  </div>
</div>

<!-- Supervisor modal (abre con un solo botón) -->
<div id="supervisorModal" class="supervisor-modal" role="dialog" aria-modal="true" aria-label="Panel supervisor">
  <div class="supervisor-panel" role="document">
    <div class="supervisor-header">
      <div>
        <strong>Panel de Supervisor</strong>
        <div class="small">Selecciona tu nombre y gestiona pendientes</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:12px">
        <label class="small" for="supervisorSelect">Autoriza como:</label>
        <select id="supervisorSelect" aria-label="Seleccionar autorizador">
          <option value="CESAR">CESAR</option>
          <option value="IVAN">IVAN</option>
          <option value="ANGEL">ANGEL</option>
          <option value="CECILIA">CECILIA</option>
        </select>
      </div>
      <div class="supervisor-actions">
        <button id="supervisorRefresh" class="btn ghost">Refrescar pendientes</button>
        <button id="supervisorClose" class="btn ghost">Cerrar</button>
      </div>
    </div>

    <div class="supervisor-body">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <input id="superSearchSerial" type="text" placeholder="Buscar serie dentro del panel supervisor" style="padding:8px;border-radius:8px;border:1px solid rgba(35,31,32,0.06);flex:1" />
        <button id="superSearchBtn" class="btn">Buscar</button>
        <button id="superCheckDuplicates" class="btn">Verificar duplicados (todos estatus)</button>
      </div>
      <div id="superPendingContainer"></div>
    </div>
  </div>
</div>

<!-- Detail modal (split view A..X + previews) -->
<div id="detailModal" style="display:none;position:fixed;inset:0;z-index:2500;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:1200px;background:var(--card-bg);border-radius:12px;box-shadow:0 20px 60px rgba(35,31,32,0.25);overflow:hidden;display:flex;flex-direction:column;height:90vh;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(35,31,32,0.04)">
      <h3 style="margin:0;font-size:16px">Detalles del registro</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="detailModeHint" class="disabled-hint"></div>
        <button id="detailClose" class="btn ghost">Cerrar</button>
      </div>
    </div>

    <div style="padding:12px;border-bottom:1px solid rgba(35,31,32,0.04);background:linear-gradient(180deg,#fff,#fbfbff)">
      <div class="preview-controls" aria-label="Controles de vista previa">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <span class="small" style="margin-right:8px;color:var(--brand-gray)">Mostrar previews PDF (si existen):</span>
          <label><input type="checkbox" id="chkD" data-idx="3" /> <strong>D</strong></label>
          <label><input type="checkbox" id="chkM" data-idx="12" /> <strong>M</strong></label>
          <label><input type="checkbox" id="chkO" data-idx="14" /> <strong>O</strong></label>
          <label><input type="checkbox" id="chkX" data-idx="23" /> <strong>X</strong></label>
        </div>
      </div>
    </div>

    <div class="split-modal" style="padding:12px;flex:1;overflow:hidden">
      <div class="split-left" id="splitLeft" aria-label="Campos A a X" style="overflow:auto"></div>
      <div class="split-right" id="splitRight" style="display:flex;flex-direction:column;gap:8px">
        <div id="previewTabsContainer" style="min-height:48px"></div>
        <div style="flex:1;overflow:auto;border-radius:8px;overflow:hidden">
          <iframe id="detailPdfFrame" src="" style="width:100%;height:100%;border:0"></iframe>
        </div>
      </div>
    </div>

    <div class="detail-actions" style="padding:12px 16px;display:flex;align-items:center;justify-content:flex-end">
      <label class="small" style="margin-right:8px">Autoriza como:</label>
      <select id="detailAutoriza" style="margin-right:12px">
        <option value="CESAR">CESAR</option>
        <option value="IVAN">IVAN</option>
        <option value="ANGEL">ANGEL</option>
        <option value="CECILIA">CECILIA</option>
      </select>
      <button id="btnAuthorize" class="btn" style="background:#059669">AUTORIZAR</button>
      <button id="btnReject" class="btn" style="background:#ef4444">RECHAZAR</button>
    </div>
  </div>
</div>

<script>
/* ============================
  CONFIG
============================ */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz-kBTZySqCBfqzMSfhBo9pZ-bkuCtdhenb2B58zhjLVReWrJbOWa09oG7toE8zjSVF/exec';

/* Column mapping */
const COL_INDEX = {
  fecha:0,emailRemitente:1,tipoSolicitud:2,facturaCompra:3,cliente:4,correoCliente:5,telefonoCliente:6,modelo:7,
  serial:8,fechaFactura:9,fechaEntrega:10,ticketAYA:11,evidenciaEntrega:12,ticketReparacion:13,evidenciaTaller:14,
  fechaIngresoTaller:15,fechaSalidaTaller:16,folio:17,fechaLimiteServicio:18,estatus:19,fechaDecision:20,autorizadoPor:21,comentarios:22,pdf:23
};

/* State */
let pendingRecords = [];
const recordMap = new Map();
let currentDetailRecord = null;

/* DOM */
const serialInput = document.getElementById('serial');
const btnSearch = document.getElementById('btnSearch');
const btnClear = document.getElementById('btnClear');
const status = document.getElementById('status');
const resultArea = document.getElementById('resultArea');
const copyRow = document.getElementById('copyRow');
const superPassInline = document.getElementById('superPassInline');
const btnRefresh = document.getElementById('btnRefresh');
const pendingContainer = document.getElementById('pendingContainer');
const pendingMeta = document.getElementById('pendingMeta');
const btnCheckDuplicates = document.getElementById('btnCheckDuplicates');
const btnBatchActions = document.getElementById('btnBatchActions');

const openSupervisor = document.getElementById('openSupervisor');
const supervisorModal = document.getElementById('supervisorModal');
const supervisorSelect = document.getElementById('supervisorSelect');
const supervisorClose = document.getElementById('supervisorClose');
const supervisorRefresh = document.getElementById('supervisorRefresh');
const superPendingContainer = document.getElementById('superPendingContainer');
const superSearchSerial = document.getElementById('superSearchSerial');
const superSearchBtn = document.getElementById('superSearchBtn');
const superCheckDuplicates = document.getElementById('superCheckDuplicates');

const detailModal = document.getElementById('detailModal');
const detailClose = document.getElementById('detailClose');
const splitLeft = document.getElementById('splitLeft');
const detailPdfFrame = document.getElementById('detailPdfFrame');
const btnAuthorize = document.getElementById('btnAuthorize');
const btnReject = document.getElementById('btnReject');
const detailAutoriza = document.getElementById('detailAutoriza');

/* Utilities */
function escapeHtml(s){ if(s===null||s===undefined) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }
function isLikelyDate(v){ if(!v) return false; if(typeof v==='string' && (/^\d{4}-\d{2}-\d{2}T/.test(v) || /^\d{1,2}\\/\d{1,2}\\/\d{2,4}/.test(v) || v.startsWith('Date('))) return true; if(typeof v==='number') return true; return false; }
function formatDate(raw){ if(!raw) return ''; if(typeof raw==='string' && raw.startsWith('Date(')){ const nums = raw.replace(/^Date\\(|\\)$/g,'').split(',').map(s=>s.trim()); const y=Number(nums[0]||0), m=Number(nums[1]||0), d=Number(nums[2]||1), hh=Number(nums[3]||0), mm=Number(nums[4]||0); return new Date(y,m,d,hh,mm).toLocaleString(); } if(typeof raw==='string' && /^\d{4}-\d{2}-\d{2}T/.test(raw)) return new Date(raw).toLocaleString(); if(typeof raw==='string' && /^\d{1,2}\\/\d{1,2}\\/\d{2,4}/.test(raw)) return raw; if(typeof raw==='number'){ try{return new Date(raw).toLocaleString()}catch(e){} } return String(raw); }
function transformToPreviewUrl(raw){ try{ const u=new URL(raw); if(u.hostname.includes('drive.google.com')){ const m=raw.match(/\\/file\\/d\\/([^\\/]+)\\/?/); if(m&&m[1]) return `https://drive.google.com/file/d/${m[1]}/preview`; const id=u.searchParams.get('id'); if(id) return `https://drive.google.com/file/d/${id}/preview`; } if(raw.toLowerCase().endsWith('.pdf')) return raw; return raw; }catch(e){ return raw; } }
function setLoading(state,message){ const loading=!!state; btnSearch.disabled=loading; btnRefresh.disabled=loading; btnCheckDuplicates.disabled=loading; btnBatchActions.disabled=loading; openSupervisor.disabled=loading; if(state) status.textContent = message || 'Cargando...'; else status.textContent=''; }

/* Startup: load pendientes (without password) for main view */
window.addEventListener('load', async ()=>{
  serialInput.focus();
  await loadPendingsNoPass();
});

/* SEARCH (main). */
btnSearch.addEventListener('click', searchSerial);
serialInput.addEventListener('keydown', e=>{ if(e.key==='Enter') searchSerial(); });
btnClear.addEventListener('click', ()=>{ serialInput.value=''; resultArea.innerHTML=''; status.textContent=''; });

async function searchSerial(){
  const serial = serialInput.value.trim();
  if(!serial){ status.textContent='Introduce un número de serie.'; return; }
  setLoading(true,'Buscando...');
  resultArea.innerHTML='';
  try {
    const url = new URL(WEBAPP_URL);
    url.searchParams.set('action','search');
    url.searchParams.set('serial', serial);
    const res = await fetch(url.toString());
    if(!res.ok) throw new Error('Error servidor');
    const data = await res.json();
    const list = Array.isArray(data) ? data : [];
    // Add pending matches not present in search results
    const serialsInSearch = new Set(list.map(r=>String(r.serial)));
    pendingRecords.forEach(p=>{
      if(p && p.serial && !serialsInSearch.has(String(p.serial)) && String(p.serial).toLowerCase().includes(serial.toLowerCase())){
        list.push(p);
      }
      if(p && p.serial) recordMap.set(String(p.serial), p);
    });
    if(list.length>0){
      renderSearchResults(list);
      status.textContent = `${list.length} resultado(s)`;
    } else {
      resultArea.innerHTML = '<div class="empty">Sin resultados</div>';
      status.textContent = 'No encontrado';
    }
  } catch(err){
    console.error(err);
    status.textContent = 'Error al buscar';
  } finally {
    setLoading(false);
  }
}

function renderSearchResults(list){
  const rows = list.map(r=>{
    const pdfHtml = pdfCell(r.pdfUrl || r[COL_INDEX.pdf] || '');
    return `<tr data-serial="${escapeAttr(String(r.serial||''))}">
      <td class="serial">${escapeHtml(r.serial||'')}</td>
      <td class="cliente">${escapeHtml(r.cliente||r[COL_INDEX.cliente]||'')}</td>
      <td class="fecha">${escapeHtml(isLikelyDate(r.fecha)?formatDate(r.fecha):(r[COL_INDEX.fecha]||''))}</td>
      <td>${renderEstatusBadge(r.estatus||r[COL_INDEX.estatus])}</td>
      <td class="small">${escapeHtml(r.usuario||'')}</td>
      <td class="small">${escapeHtml(r.modelo||'')}</td>
      <td class="small">${escapeHtml(r.email||r[COL_INDEX.emailRemitente]||'')}</td>
      <td class="small">${escapeHtml(r.telefono||r[COL_INDEX.telefonoCliente]||'')}</td>
      <td class="pdf-cell">${pdfHtml}</td>
      <td class="actions-cell"><button class="btn ghost view-details" data-serial="${escapeAttr(String(r.serial||''))}" data-context="advisor">Ver detalles</button></td>
    </tr>`;
  }).join('');
  resultArea.innerHTML = `<div style="overflow:auto"><table class="results" role="table" aria-label="Resultados"><thead><tr><th>Serie</th><th>Cliente</th><th>Fecha</th><th>Estatus</th><th>Usuario</th><th>Modelo</th><th>Email</th><th>Tel</th><th>PDF</th><th>Detalles</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  attachResultListeners();
  attachPdfClicks();
}

/* Copy first visible row from memory */
copyRow.addEventListener('click', async ()=>{
  const table = resultArea.querySelector('table.results');
  if(!table){ alert('No hay resultados para copiar'); return; }
  const firstTr = table.querySelector('tbody tr');
  if(!firstTr){ alert('No hay resultados para copiar'); return; }
  const serial = firstTr.dataset.serial;
  if(!serial){ alert('No hay serial disponible'); return; }
  const rec = recordMap.get(serial);
  if(!rec){ alert('Registro no disponible en memoria'); return; }
  const keys = ['serial','cliente','fecha','estatus','usuario','modelo','email','telefono','pdfUrl'];
  const values = keys.map(k => {
    const v = rec[k] !== undefined ? rec[k] : (rec[COL_INDEX[k]] !== undefined ? rec[COL_INDEX[k]] : '');
    return String(v===null||v===undefined?'':v);
  });
  const text = values.join('\t');
  try{ await navigator.clipboard.writeText(text); alert('Fila (JSON) copiada al portapapeles'); }catch(e){ console.error(e); alert('No se pudo copiar al portapapeles'); }
});

/* Render pending table (main view) */
function renderPendingTable(list){
  if(!Array.isArray(list) || list.length===0){ pendingContainer.innerHTML = '<div class="empty">No hay pendientes</div>'; pendingMeta.textContent='Pendientes: 0'; return; }
  const rows = list.map(item=>{
    const pdfUrl = item.pdfUrl || item[COL_INDEX.pdf] || item['Link_PDF'] || item['link_pdf'] || '';
    const pdfCellSimple = pdfUrl ? `<a href="${escapeAttr(String(pdfUrl))}" target="_blank" rel="noopener">Abrir</a>` : '<span class="small" style="color:var(--brand-gray)">Sin PDF</span>';
    const has = idx => { const v = getFieldByIndexForRender(item, idx); return v && String(v).trim() !== ''; };
    const evidenceBadges = [ has(3)?'<span class="small" style="color:green">D</span>':'<span class="small" style="color:#ef4444">D✕</span>',
      has(12)?'<span class="small" style="color:green">M</span>':'<span class="small" style="color:#ef4444">M✕</span>',
      has(14)?'<span class="small" style="color:green">O</span>':'<span class="small" style="color:#ef4444">O✕</span>',
      has(23)?'<span class="small" style="color:green">X</span>':'<span class="small" style="color:#ef4444">X✕</span>' ].join(' ');
    return `<tr data-serial="${escapeAttr(String(item.serial||''))}">
      <td style="font-weight:700">${escapeHtml(item.serial||'')}</td>
      <td>${escapeHtml(item.cliente||item[COL_INDEX.cliente]||'')}</td>
      <td>${escapeHtml(isLikelyDate(item.fecha)?formatDate(item.fecha):(item[COL_INDEX.fecha]||''))}</td>
      <td>${renderEstatusBadge(item.estatus||item[COL_INDEX.estatus])}</td>
      <td>${escapeHtml(item.modelo||'')}</td>
      <td>${evidenceBadges}</td>
      <td>${pdfCellSimple}</td>
      <td>
        <select class="actionSelect">
          <option value="">-- Acción --</option>
          <option value="AUTORIZADO">AUTORIZADO</option>
          <option value="RECHAZADO">RECHAZADO</option>
        </select>
        <button class="applyBtn btn ghost" data-serial="${escapeAttr(String(item.serial||''))}" style="margin-left:6px">Aplicar</button>
        <button class="view-details btn ghost" data-serial="${escapeAttr(String(item.serial||''))}" data-context="supervisor" style="margin-left:6px">Ver detalles</button>
      </td>
    </tr>`;
  }).join('');
  pendingContainer.innerHTML = `<div style="overflow:auto"><table class="pending-table" role="table" aria-label="Pendientes"><thead><tr><th>Serie</th><th>Cliente</th><th>Fecha</th><th>Estatus</th><th>Modelo</th><th>Evidencias</th><th>PDF</th><th>Acción</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  pendingMeta.textContent = `Pendientes: ${list.length}`;
  attachPendingListeners();
}

/* Helper to extract field by index */
function getFieldByIndexForRender(record, idx){
  const keyByIndex = Object.keys(COL_INDEX).find(k=>COL_INDEX[k]===idx);
  if(keyByIndex && record[keyByIndex]) return record[keyByIndex];
  const letter = String.fromCharCode(65+idx);
  if(record[letter]) return record[letter];
  if(record[idx]) return record[idx];
  return '';
}

/* Attach listeners for pending actions */
function attachPendingListeners(){
  const applyBtns = pendingContainer.querySelectorAll('.applyBtn');
  applyBtns.forEach(btn=>{ btn.removeEventListener('click', onApplyClick); btn.addEventListener('click', onApplyClick); });
  const viewBtns = pendingContainer.querySelectorAll('.view-details');
  viewBtns.forEach(b=>{ b.removeEventListener('click', onViewDetailsClick); b.addEventListener('click', onViewDetailsClick); });
}

/* When applying from pending row: use supervisorSelect value as autorizador if modal open */
async function onApplyClick(e){
  const tr = e.target.closest('tr');
  const serial = tr && tr.dataset.serial;
  const select = tr.querySelector('.actionSelect');
  const action = select && select.value;
  if(!action) return alert('Selecciona una acción');
  const autorizador = (supervisorModal.style.display === 'flex' || supervisorModal.style.display === 'block') ? supervisorSelect.value : (detailAutoriza ? detailAutoriza.value : '');
  let pass = superPassInline.value.trim();
  if(!pass){
    pass = prompt(`Introduce contraseña supervisor para ${action} en serie ${serial}`);
    if(!pass) return alert('Contraseña requerida para autorizar/rechazar');
  }
  setLoading(true,'Validando contraseña...');
  try {
    const ok = await validateSupervisorPass(pass);
    if(!ok){ alert('Contraseña inválida'); setLoading(false); return; }
    setLoading(true,'Aplicando decisión...');
    const url = new URL(WEBAPP_URL);
    url.searchParams.set('action','update');
    url.searchParams.set('serial', serial);
    url.searchParams.set('newStatus', action);
    url.searchParams.set('autorizador', autorizador);
    url.searchParams.set('pass', pass);
    const res = await fetch(url.toString());
    if(!res.ok) throw new Error('Error servidor');
    const data = await res.json();
    if(data && data.ok){ alert('Actualizado'); await refreshPendingsWithPass(pass); superPassInline.value = ''; }
    else { alert('Error: ' + (data && data.error ? data.error : 'no se pudo actualizar')); }
  } catch(err){ console.error(err); alert('Error al actualizar'); } finally { setLoading(false); }
}

/* View details: open modal split view */
function onViewDetailsClick(e){
  const serial = e.currentTarget.dataset.serial;
  const context = e.currentTarget.dataset.context || 'supervisor';
  if(!serial) return alert('Serial no disponible');
  const rec = recordMap.get(serial);
  if(!rec) return alert('Registro no disponible');
  openDetailModal(rec,{context});
}

/* Validate supervisor password by calling backend (action=pending&pass=...) */
async function validateSupervisorPass(pass){
  try {
    const url = new URL(WEBAPP_URL);
    url.searchParams.set('action','pending');
    url.searchParams.set('pass', pass);
    const res = await fetch(url.toString());
    if(!res.ok) return false;
    const data = await res.json();
    return Array.isArray(data) || (data && !data.error);
  } catch(e){ console.error('Error validando pass',e); return false; }
}

/* Refresh pendings using provided pass (if backend requires pass) */
async function refreshPendingsWithPass(pass){
  try {
    setLoading(true,'Refrescando pendientes...');
    const url = new URL(WEBAPP_URL);
    url.searchParams.set('action','pending');
    if(pass) url.searchParams.set('pass', pass);
    const res = await fetch(url.toString());
    if(!res.ok) throw new Error('No autorizado');
    const data = await res.json();
    pendingRecords = Array.isArray(data) ? data : [];
    pendingRecords.forEach(r=>{ if(r && r.serial) recordMap.set(String(r.serial), r); });
    renderPendingTable(pendingRecords);
    if(supervisorModal.style.display === 'flex' || supervisorModal.style.display === 'block'){
      renderSupervisorPending(pendingRecords);
    }
  } catch(e){ console.error(e); alert('Error al cargar pendientes'); } finally { setLoading(false); }
}

/* btnRefresh: if inline pass provided, use it; else try without pass */
btnRefresh.addEventListener('click', async ()=>{
  const pass = superPassInline.value.trim();
  await refreshPendingsWithPass(pass || undefined);
});

/* Duplicate check (main): checks duplicates against ANY estatus in recordMap and pendingRecords */
btnCheckDuplicates.addEventListener('click', async ()=>{
  if(!pendingRecords || pendingRecords.length===0) return alert('No hay pendientes cargados');
  setLoading(true,'Verificando duplicados...');
  try {
    // Build counts from recordMap and pendingRecords
    const counts = {};
    for(const [k,v] of recordMap.entries()){ if(k) counts[String(k)] = (counts[String(k)]||0) + 1; }
    pendingRecords.forEach(p=>{ if(p && p.serial) counts[String(p.serial)] = (counts[String(p.serial)]||0) + 1; });
    const duplicates = Object.keys(counts).filter(k=>counts[k] > 1);
    if(duplicates.length===0) alert('No se detectaron duplicados en los pendientes.');
    else {
      duplicates.forEach(d=>{
        const tr = pendingContainer.querySelector(`tr[data-serial="${escapeAttr(String(d))}"]`);
        if(tr) tr.classList.add('duplicate-row');
      });
      alert(`Se detectaron ${duplicates.length} registro(s) duplicados. Filas resaltadas.`);
    }
  } catch(e){ console.error(e); alert('Error al verificar duplicados'); } finally { setLoading(false); }
});

/* Batch actions: similar flow, uses supervisorSelect as autorizador when panel open */
btnBatchActions.addEventListener('click', async ()=>{
  const table = pendingContainer.querySelector('table.pending-table');
  if(!table) return alert('No hay pendientes');
  const already = table.querySelector('thead th.select-col');
  if(!already){
    const th = document.createElement('th'); th.className='select-col'; th.innerHTML = '<input id="selectAll" type="checkbox" />';
    table.querySelector('thead tr').insertBefore(th, table.querySelector('thead tr').children[0]);
    table.querySelectorAll('tbody tr').forEach(tr=>{
      const td = document.createElement('td'); td.innerHTML = `<input class="row-select" type="checkbox" data-serial="${escapeAttr(tr.dataset.serial)}" />`; tr.insertBefore(td, tr.children[0]);
    });
    document.getElementById('selectAll').addEventListener('change', e=>{ table.querySelectorAll('.row-select').forEach(cb=>cb.checked=e.target.checked); });
    btnBatchActions.textContent='Aplicar acción en seleccionados';
    btnBatchActions.classList.remove('btn','ghost'); btnBatchActions.classList.add('btn');
    btnBatchActions.onclick = async ()=>{
      const selected = Array.from(table.querySelectorAll('.row-select:checked')).map(cb=>cb.dataset.serial);
      if(selected.length===0) return alert('No hay registros seleccionados');
      const action = prompt(`Acción para ${selected.length} registros (AUTORIZADO / RECHAZADO):`);
      if(!action) return;
      const autorizador = (supervisorModal.style.display === 'flex' || supervisorModal.style.display === 'block') ? supervisorSelect.value : (detailAutoriza ? detailAutoriza.value : '');
      let pass = superPassInline.value.trim();
      if(!pass){
        pass = prompt(`Introduce contraseña supervisor para acción en lote (${action})`);
        if(!pass) return alert('Contraseña requerida para autorizar/rechazar');
      }
      setLoading(true,'Validando contraseña...');
      try {
        const ok = await validateSupervisorPass(pass);
        if(!ok){ alert('Contraseña inválida'); setLoading(false); return; }
        setLoading(true,'Aplicando decisiones en lote...');
        for(const s of selected){
          try {
            const url = new URL(WEBAPP_URL);
            url.searchParams.set('action','update');
            url.searchParams.set('serial', s);
            url.searchParams.set('newStatus', action);
            url.searchParams.set('autorizador', autorizador);
            url.searchParams.set('pass', pass);
            await fetch(url.toString());
          } catch(e){ console.warn('Error actualizando',s,e); }
        }
        alert('Acciones aplicadas. Refrescando pendientes...');
        await refreshPendingsWithPass(pass);
        superPassInline.value = '';
      } catch(e){ console.error(e); alert('Error en acciones en lote'); } finally { setLoading(false); }
    };
  }
});

/* Supervisor panel: open/close and render pendings inside it */
openSupervisor.addEventListener('click', async ()=>{
  supervisorModal.style.display = 'flex';
  detailAutoriza.value = supervisorSelect.value;
  renderSupervisorPending(pendingRecords);
});
supervisorClose.addEventListener('click', ()=>{ supervisorModal.style.display = 'none'; });
supervisorRefresh.addEventListener('click', async ()=>{ const pass = superPassInline.value.trim(); await refreshPendingsWithPass(pass || undefined); });
supervisorSelect.addEventListener('change', ()=>{ detailAutoriza.value = supervisorSelect.value; });

/* Render pendings inside supervisor panel (with action controls) */
function renderSupervisorPending(list){
  if(!Array.isArray(list) || list.length===0){ superPendingContainer.innerHTML = '<div class="empty">No hay pendientes</div>'; return; }
  const rows = list.map(item=>{
    const pdfUrl = item.pdfUrl || item[COL_INDEX.pdf] || item['Link_PDF'] || item['link_pdf'] || '';
    const pdfCellSimple = pdfUrl ? `<a href="${escapeAttr(String(pdfUrl))}" target="_blank" rel="noopener">Abrir</a>` : '<span class="small" style="color:var(--brand-gray)">Sin PDF</span>';
    const has = idx => { const v = getFieldByIndexForRender(item, idx); return v && String(v).trim() !== ''; };
    const evidenceBadges = [ has(3)?'<span class="small" style="color:green">D</span>':'<span class="small" style="color:#ef4444">D✕</span>',
      has(12)?'<span class="small" style="color:green">M</span>':'<span class="small" style="color:#ef4444">M✕</span>',
      has(14)?'<span class="small" style="color:green">O</span>':'<span class="small" style="color:#ef4444">O✕</span>',
      has(23)?'<span class="small" style="color:green">X</span>':'<span class="small" style="color:#ef4444">X✕</span>' ].join(' ');
    return `<tr data-serial="${escapeAttr(String(item.serial||''))}">
      <td style="font-weight:700">${escapeHtml(item.serial||'')}</td>
      <td>${escapeHtml(item.cliente||item[COL_INDEX.cliente]||'')}</td>
      <td>${escapeHtml(isLikelyDate(item.fecha)?formatDate(item.fecha):(item[COL_INDEX.fecha]||''))}</td>
      <td>${renderEstatusBadge(item.estatus||item[COL_INDEX.estatus])}</td>
      <td>${escapeHtml(item.modelo||'')}</td>
      <td>${evidenceBadges}</td>
      <td>${pdfCellSimple}</td>
      <td>
        <select class="actionSelect">
          <option value="">-- Acción --</option>
          <option value="AUTORIZADO">AUTORIZADO</option>
          <option value="RECHAZADO">RECHAZADO</option>
        </select>
        <button class="applyBtn btn ghost" data-serial="${escapeAttr(String(item.serial||''))}" style="margin-left:6px">Aplicar</button>
        <button class="view-details btn ghost" data-serial="${escapeAttr(String(item.serial||''))}" data-context="supervisor" style="margin-left:6px">Ver detalles</button>
      </td>
    </tr>`;
  }).join('');
  superPendingContainer.innerHTML = `<div style="overflow:auto"><table class="pending-table" role="table" aria-label="Pendientes Supervisor"><thead><tr><th>Serie</th><th>Cliente</th><th>Fecha</th><th>Estatus</th><th>Modelo</th><th>Evidencias</th><th>PDF</th><th>Acción</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const applyBtns = superPendingContainer.querySelectorAll('.applyBtn');
  applyBtns.forEach(btn=>{ btn.removeEventListener('click', onApplyClick); btn.addEventListener('click', onApplyClick); });
  const viewBtns = superPendingContainer.querySelectorAll('.view-details');
  viewBtns.forEach(b=>{ b.removeEventListener('click', onViewDetailsClick); b.addEventListener('click', onViewDetailsClick); });
}

/* Supervisor search inside panel */
superSearchBtn.addEventListener('click', ()=>{
  const q = superSearchSerial.value.trim().toLowerCase();
  if(!q){ renderSupervisorPending(pendingRecords); return; }
  const filtered = pendingRecords.filter(r=> r && r.serial && String(r.serial).toLowerCase().includes(q));
  renderSupervisorPending(filtered);
});

/* Supervisor duplicate check across any estatus */
superCheckDuplicates.addEventListener('click', async ()=>{
  if(!pendingRecords || pendingRecords.length===0) return alert('No hay pendientes cargados');
  setLoading(true,'Verificando duplicados (todos estatus)...');
  try {
    const counts = {};
    for(const [k,v] of recordMap.entries()){ if(k) counts[String(k)] = (counts[String(k)]||0) + 1; }
    pendingRecords.forEach(p=>{ if(p && p.serial) counts[String(p.serial)] = (counts[String(p.serial)]||0) + 1; });
    const duplicates = Object.keys(counts).filter(k=>counts[k] > 1);
    if(duplicates.length === 0) alert('No se detectaron duplicados en los pendientes ni en registros existentes.');
    else {
      duplicates.forEach(s=>{
        const trMain = pendingContainer.querySelector(`tr[data-serial="${escapeAttr(String(s))}"]`);
        if(trMain) trMain.classList.add('duplicate-row');
        const trSuper = superPendingContainer.querySelector(`tr[data-serial="${escapeAttr(String(s))}"]`);
        if(trSuper) trSuper.classList.add('duplicate-row');
      });
      alert(`Se detectaron ${duplicates.length} serial(es) duplicados en el sistema. Filas resaltadas.`);
    }
  } catch(e){ console.error(e); alert('Error al verificar duplicados'); } finally { setLoading(false); }
});

/* Detail modal open */
function openDetailModal(rec, opts){
  currentDetailRecord = rec;
  splitLeft.innerHTML = '';
  Object.keys(rec).forEach(k=>{
    const div = document.createElement('div'); div.className='field';
    div.innerHTML = `<strong>${escapeHtml(k)}</strong><span>${escapeHtml(String(rec[k]||''))}</span>`;
    splitLeft.appendChild(div);
  });
  const pdfUrl = rec.pdfUrl || rec[COL_INDEX.pdf] || '';
  detailPdfFrame.src = transformToPreviewUrl(pdfUrl || '');
  detailAutoriza.value = supervisorSelect ? supervisorSelect.value : (rec.autorizadoPor || 'CESAR');
  detailModal.style.display = 'flex';
}

/* Close detail modal */
detailClose.addEventListener('click', ()=>{ detailModal.style.display = 'none'; });

/* Render estatus badge */
function renderEstatusBadge(s){
  const st = (s||'').toString().toUpperCase();
  if(st.includes('AUTORIZ')) return `<span class="estatus autorizado">AUTORIZADO</span>`;
  if(st.includes('RECHAZ')) return `<span class="estatus rechazado">RECHAZADO</span>`;
  return `<span class="estatus pendiente">${escapeHtml(s||'PENDIENTE')}</span>`;
}

/* PDF cell renderer */
function pdfCell(raw){
  const url = raw ? transformToPreviewUrl(raw) : '';
  if(!url) return '<span class="small" style="color:var(--brand-gray)">Sin PDF</span>';
  return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener">Ver PDF</a>`;
}

/* Attach result listeners */
function attachResultListeners(){
  const viewBtns = resultArea.querySelectorAll('.view-details');
  viewBtns.forEach(b=>{ b.removeEventListener('click', onViewDetailsClick); b.addEventListener('click', onViewDetailsClick); });
}

/* Attach PDF clicks (placeholder) */
function attachPdfClicks(){}

/* Utility: refresh pendingRecords from server (no pass) */
async function loadPendingsNoPass(){
  try {
    setLoading(true,'Cargando pendientes...');
    const url = new URL(WEBAPP_URL);
    url.searchParams.set('action','pending');
    const res = await fetch(url.toString());
    if(res.ok){
      const data = await res.json();
      pendingRecords = Array.isArray(data) ? data : [];
      pendingRecords.forEach(r=>{ if(r && r.serial) recordMap.set(String(r.serial), r); });
      renderPendingTable(pendingRecords);
    } else {
      pendingContainer.innerHTML = '<div class="empty">Introduce contraseña al aprobar/rechazar para ver o modificar pendientes.</div>';
      pendingMeta.textContent = 'Pendientes: —';
    }
  } catch(e){ console.warn('No se pudieron cargar pendientes automáticamente',e); pendingContainer.innerHTML = '<div class="empty">Introduce contraseña al aprobar/rechazar para ver o modificar pendientes.</div>'; pendingMeta.textContent = 'Pendientes: —'; }
  finally { setLoading(false); }
}
